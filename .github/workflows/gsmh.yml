name: GSMH Autonomous Research

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gsmh-autonomous
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Run GSMH Autonomous Research
        run: |
          mkdir -p agents/reports
          mkdir -p memory

          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          import requests


          # ============================================================
          # CONFIGURATION
          # ============================================================

          API_KEY = os.environ.get("GEMINI_API_KEY")

          if not API_KEY:
              raise RuntimeError("GEMINI_API_KEY is missing")


          MODELS = [
              "gemini-3.8-flash",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash",
              "gemini-3.5-flash-lite",
              "gemini-3.1-flash-lite",
              "gemini-3-flash-preview",
              "gemini-2.5-flash",
              "gemini-2.5-flash-lite",
              "gemma-4-31b-it",
          ]

          MAX_CYCLES = 10
          REQUEST_TIMEOUT = 300
          MAX_OUTPUT_TOKENS = 12000

          RATE_LIMIT_COOLDOWN = 60
          INVALID_MODEL_COOLDOWN = 3600
          NETWORK_COOLDOWN = 30

          ROOT = Path(".")
          REPORTS = ROOT / "agents" / "reports"
          STATE_FILE = ROOT / "agents" / "state.json"

          REPORTS.mkdir(parents=True, exist_ok=True)


          # ============================================================
          # GSMH IDENTITY LOCK
          # ============================================================

          GSMH_IDENTITY = """
          GSMH = Gravity Spacetime Memory Hypothesis.

          GSMH is a speculative gravitational hypothesis,
          NOT a proven theory.

          Core target:

          The gravitational response may depend on present
          matter-energy plus a causal functional of previous
          spacetime curvature and/or previous matter distribution.

          Target schematic:

          E_munu[g](x)
          =
          8*pi*G*T_munu(x)
          +
          M_munu[g,T_history](x)

          M_munu represents a possible hereditary gravitational
          memory functional.

          The existence, mathematical form, consistency,
          magnitude and observability of this memory must be derived.

          Do NOT redefine GSMH into an unrelated modified-gravity theory.

          Distinguish carefully between:

          1. genuine hereditary memory
          2. ordinary retarded response
          3. curved-spacetime tail effects
          4. gravitational-wave memory
          5. unrelated modified gravity
          """


          # ============================================================
          # FILE HELPERS
          # ============================================================

          def read_file(path, limit=20000):
              try:
                  text = path.read_text(encoding="utf-8")
                  return text[-limit:]
              except Exception:
                  return ""


          def write_file(path, content):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")


          canonical_model = read_file(
              ROOT / "memory" / "CANONICAL_MODEL.md"
          )

          open_problems = read_file(
              ROOT / "memory" / "OPEN_PROBLEMS.md"
          )


          # ============================================================
          # LOAD STATE
          # ============================================================

          state = {}

          if STATE_FILE.exists():
              try:
                  state = json.loads(
                      STATE_FILE.read_text(encoding="utf-8")
                  )
              except Exception:
                  state = {}


          previous_synthesis = state.get(
              "previous_synthesis",
              ""
          )

          previous_audit = state.get(
              "previous_audit",
              ""
          )


          # ============================================================
          # MODEL ROTATION
          # ============================================================

          model_index = int(
              state.get("model_index", 0)
          ) % len(MODELS)

          cooldown_until = {
              model: 0.0
              for model in MODELS
          }

          failures = {
              model: 0
              for model in MODELS
          }


          def get_next_available_model():

              global model_index

              now = time.time()

              for _ in range(len(MODELS)):

                  model = MODELS[model_index]

                  if now >= cooldown_until[model]:
                      return model

                  model_index = (
                      model_index + 1
                  ) % len(MODELS)

              print(
                  "ALL MODELS TEMPORARILY UNAVAILABLE."
              )

              time.sleep(RATE_LIMIT_COOLDOWN)

              return get_next_available_model()


          def rotate():

              global model_index

              model_index = (
                  model_index + 1
              ) % len(MODELS)


          # ============================================================
          # GEMINI API
          # ============================================================

          def build_url(model):

              return (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/"
                  + model
                  + ":generateContent?key="
                  + API_KEY
              )


          def call_model(prompt):

              global model_index

              last_error = "unknown"


              # Several complete passes through the model pool.
              for attempt in range(len(MODELS) * 3):

                  model = get_next_available_model()

                  print("")
                  print(
                      "=================================================="
                  )
                  print(
                      "MODEL ATTEMPT:",
                      attempt + 1
                  )
                  print(
                      "USING MODEL:",
                      model
                  )
                  print(
                      "=================================================="
                  )


                  payload = {
                      "contents": [
                          {
                              "parts": [
                                  {
                                      "text": prompt
                                  }
                              ]
                          }
                      ],
                      "generationConfig": {
                          "temperature": 0.15,
                          "topP": 0.90,
                          "maxOutputTokens": MAX_OUTPUT_TOKENS
                      }
                  }


                  try:

                      response = requests.post(
                          build_url(model),
                          json=payload,
                          timeout=REQUEST_TIMEOUT
                      )


                      # ------------------------------------------------
                      # SUCCESS
                      # ------------------------------------------------

                      if response.status_code == 200:

                          data = response.json()

                          candidates = data.get(
                              "candidates",
                              []
                          )

                          if not candidates:
                              raise RuntimeError(
                                  "No candidates returned"
                              )

                          parts = (
                              candidates[0]
                              .get("content", {})
                              .get("parts", [])
                          )

                          text_parts = []

                          for part in parts:

                              if isinstance(part, dict):

                                  text = part.get(
                                      "text",
                                      ""
                                  )

                                  if text:
                                      text_parts.append(text)


                          result = "\n".join(
                              text_parts
                          ).strip()


                          if result:

                              print(
                                  "MODEL SUCCESS:",
                                  model
                              )

                              failures[model] = 0

                              return result


                          raise RuntimeError(
                              "Empty model response"
                          )


                      # ------------------------------------------------
                      # RATE LIMIT / TEMPORARY SERVER FAILURE
                      # ------------------------------------------------

                      if response.status_code in (
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          last_error = (
                              "HTTP "
                              + str(response.status_code)
                          )

                          failures[model] += 1

                          cooldown_until[model] = (
                              time.time()
                              + RATE_LIMIT_COOLDOWN
                          )

                          print(
                              "TEMPORARILY LIMITED:",
                              model,
                              last_error
                          )

                          rotate()

                          continue


                      # ------------------------------------------------
                      # INVALID / UNAVAILABLE MODEL
                      # ------------------------------------------------

                      if response.status_code in (
                          400,
                          401,
                          403,
                          404
                      ):

                          last_error = (
                              "HTTP "
                              + str(response.status_code)
                              + ": "
                              + response.text[:1000]
                          )

                          failures[model] += 1

                          cooldown_until[model] = (
                              time.time()
                              + INVALID_MODEL_COOLDOWN
                          )

                          print(
                              "MODEL UNAVAILABLE:",
                              model,
                              last_error
                          )

                          rotate()

                          continue


                      # ------------------------------------------------
                      # OTHER HTTP ERROR
                      # ------------------------------------------------

                      last_error = (
                          "HTTP "
                          + str(response.status_code)
                          + ": "
                          + response.text[:1000]
                      )

                      failures[model] += 1

                      cooldown_until[model] = (
                          time.time()
                          + RATE_LIMIT_COOLDOWN
                      )

                      print(
                          "HTTP ERROR:",
                          model,
                          last_error
                      )

                      rotate()

                      continue


                  except requests.RequestException as exc:

                      last_error = str(exc)

                      failures[model] += 1

                      cooldown_until[model] = (
                          time.time()
                          + NETWORK_COOLDOWN
                      )

                      print(
                          "NETWORK ERROR:",
                          model,
                          exc
                      )

                      rotate()

                      continue


                  except Exception as exc:

                      last_error = str(exc)

                      failures[model] += 1

                      print(
                          "MODEL ERROR:",
                          model,
                          exc
                      )

                      rotate()

                      continue


              raise RuntimeError(
                  "All model attempts failed. "
                  "Last error: "
                  + last_error
              )


          # ============================================================
          # RESEARCH LOOP
          # ============================================================

          for cycle in range(
              1,
              MAX_CYCLES + 1
          ):

              print("")
              print("")
              print(
                  "##################################################"
              )
              print(
                  "GSMH AUTONOMOUS CYCLE",
                  cycle,
                  "/",
                  MAX_CYCLES
              )
              print(
                  "##################################################"
              )


              # ========================================================
              # FOUNDATION
              # ========================================================

              foundation_prompt = f"""
              You are the FOUNDATION agent of GSMH.

              {GSMH_IDENTITY}

              EXISTING CANONICAL MODEL:
              {canonical_model}

              EXISTING OPEN PROBLEMS:
              {open_problems}

              PREVIOUS SYNTHESIS:
              {previous_synthesis[-16000:]}

              PREVIOUS AUDIT:
              {previous_audit[-12000:]}

              Your task:

              Select ONE highest-priority mathematical problem
              that must be solved for GSMH.

              Do not create a different theory.

              Focus on the origin of the proposed gravitational
              memory response.

              Explicitly determine whether the target can be
              distinguished from ordinary retarded response.

              Produce:

              1. CURRENT GAP
              2. SINGLE MATHEMATICAL TARGET
              3. NECESSARY DERIVATION
              4. NECESSARY ASSUMPTIONS
              5. FALSIFICATION TEST
              6. ACCEPTANCE CRITERIA

              Do real mathematical planning, not general discussion.
              """


              foundation = call_model(
                  foundation_prompt
              )


              # ========================================================
              # DERIVATION
              # ========================================================

              derivation_prompt = f"""
              You are the DERIVATION agent of GSMH.

              {GSMH_IDENTITY}

              FOUNDATION REPORT:
              {foundation[-20000:]}

              PREVIOUS SYNTHESIS:
              {previous_synthesis[-16000:]}

              Perform the actual mathematical derivation.

              PRIORITY IS THE ORIGIN OF THE MEMORY RESPONSE.

              Investigate the microscopic CTP/Schwinger-Keldysh
              and 2PI route where appropriate.

              Investigate a microscopic field q with collective
              operator:

              O(x) = q^2(x)

              Analyze the static susceptibility:

              Pi(k)
              =
              integral d^3q/(2*pi)^3
              [
                  1 /
                  ((q^2+m^2)((q+k)^2+m^2))
              ]

              Determine exactly what this response means.

              Determine whether it can generate a genuine hereditary
