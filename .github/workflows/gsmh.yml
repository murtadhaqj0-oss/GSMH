name: GSMH Autonomous Research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Run GSMH autonomous research
        run: |
          mkdir -p agents/reports
          mkdir -p agents

          python <<'PY'
          import os
          import json
          import re
          import time
          from pathlib import Path

          import requests

          # ============================================================
          # CONFIGURATION
          # ============================================================

          API_KEY = os.environ.get("GEMINI_API_KEY")

          if not API_KEY:
              raise RuntimeError("GEMINI_API_KEY is missing")

          # 10-model rotating pool
          MODELS = [
              "gemini-3.8-flash",
              "gemini-3.7-flash",
              "gemini-3.6-flash",
              "gemini-3.5-flash",
              "gemini-3.5-flash-lite",
              "gemini-3.1-flash-lite",
              "gemini-3-flash-preview",
              "gemini-2.5-flash",
              "gemini-2.5-flash-lite",
              "gemma-4-31b-it",
          ]

          MAX_CYCLES = 20
          REQUEST_TIMEOUT = 300
          MAX_OUTPUT_TOKENS = 12000

          # Wait time before retrying a temporarily limited model
          RATE_LIMIT_COOLDOWN = 60

          # Maximum number of attempts across the model pool
          MAX_MODEL_ATTEMPTS = len(MODELS) * 2

          ROOT = Path(".")
          REPORTS = ROOT / "agents" / "reports"
          STATE_FILE = ROOT / "agents" / "state.json"

          REPORTS.mkdir(parents=True, exist_ok=True)

          # ============================================================
          # MODEL ROTATION STATE
          # ============================================================

          model_index = 0

          cooldown_until = {
              model: 0.0
              for model in MODELS
          }

          disabled_until = {
              model: 0.0
              for model in MODELS
          }

          model_failures = {
              model: 0
              for model in MODELS
          }

          # ============================================================
          # GSMH IDENTITY
          # ============================================================

          GSMH_IDENTITY = r"""
          ============================================================
          GSMH MODEL IDENTITY LOCK
          ============================================================

          MODEL IDENTITY:
          GSMH-HEREDITARY-GRAVITY

          Full name:
          Gravity Spacetime Memory Hypothesis

          GSMH is a speculative gravitational hypothesis.

          Core statement:

          The gravitational response at an event may depend not only
          on the present matter-energy configuration, but also on a
          mathematically defined functional of prior spacetime
          curvature and/or prior matter distribution.

          The central proposed physical idea is HEREDITARY
          GRAVITATIONAL RESPONSE: a previous matter configuration may
          leave a residual gravitational influence after the source
          changes, moves, disperses, explodes, or otherwise evolves.

          The existence, mathematical form, consistency, magnitude and
          observability of this memory are NOT assumed to be proven.

          Target schematic equation:

              E_munu[g](x)
              =
              8*pi*G*T_munu(x)
              +
              M_munu[g,T_history](x)

          M_munu represents a possible causal functional of previous
          gravitational/matter history.

          THIS EQUATION IS ONLY A TARGET REPRESENTATION.
          It must be derived, modified, or rejected.

          GSMH IS A HYPOTHESIS, NOT A PROVEN THEORY.
          ============================================================
          """

          FORBIDDEN_REDEFINITIONS = [
              "generalized scalar-metric-holographic",
              "generalized scalar metric holographic",
              "scalar-metric-holographic",
          ]

          # ============================================================
          # FILE HELPERS
          # ============================================================

          def read_text(path):
              try:
                  return path.read_text(encoding="utf-8")
              except Exception:
                  return ""

          def save(path, text):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding="utf-8")

          canonical_model = read_text(
              ROOT / "memory" / "CANONICAL_MODEL.md"
          )

          open_problems = read_text(
              ROOT / "memory" / "OPEN_PROBLEMS.md"
          )

          # ============================================================
          # MODEL ROTATION
          # ============================================================

          def get_available_model():
              """
              Find the next model whose cooldown has expired.
              Searches circularly through the entire pool.
              """

              global model_index

              now = time.time()

              for _ in range(len(MODELS)):
                  model = MODELS[model_index]

                  if (
                      now >= cooldown_until[model]
                      and now >= disabled_until[model]
                  ):
                      return model

                  model_index = (
                      model_index + 1
                  ) % len(MODELS)

              return None

          def rotate_model():
              """
              Move to the next model in circular order.
              """

              global model_index

              model_index = (
                  model_index + 1
              ) % len(MODELS)

          def mark_rate_limited(model):
              """
              Temporarily remove a rate-limited model from rotation.
              """

              cooldown_until[model] = (
                  time.time() + RATE_LIMIT_COOLDOWN
              )

              model_failures[model] += 1

          def mark_failed(model):
              """
              Temporarily disable a repeatedly failing model.
              """

              model_failures[model] += 1

              if model_failures[model] >= 3:
                  disabled_until[model] = (
                      time.time() + 300
                  )

          # ============================================================
          # GEMINI API
          # ============================================================

          def build_api_url(model):
              return (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/"
                  + model
                  + ":generateContent?key="
                  + API_KEY
              )

          def call_model(prompt):
              """
              Send request using the current model.

              If a model hits 429/5xx, automatically rotate to the
              next available model.

              The rotation is circular:
              1 -> 2 -> ... -> 10 -> 1
              """

              global model_index

              last_error = None

              for pool_attempt in range(MAX_MODEL_ATTEMPTS):

                  model = get_available_model()

                  if model is None:
                      print(
                          "All models are temporarily unavailable."
                      )

                      time.sleep(RATE_LIMIT_COOLDOWN)

                      continue

                  print(
                      f"USING MODEL: {model}"
                  )

                  payload = {
                      "contents": [
                          {
                              "parts": [
                                  {
                                      "text": prompt
                                  }
                              ]
                          }
                      ],
                      "generationConfig": {
                          "temperature": 0.15,
                          "topP": 0.90,
                          "maxOutputTokens": MAX_OUTPUT_TOKENS
                      }
                  }

                  try:
                      response = requests.post(
                          build_api_url(model),
                          json=payload,
                          timeout=REQUEST_TIMEOUT
                      )

                      # ------------------------------------------------
                      # SUCCESS
                      # ------------------------------------------------

                      if response.status_code == 200:

                          data = response.json()

                          candidates = data.get(
                              "candidates",
                              []
                          )

                          if not candidates:
                              raise RuntimeError(
                                  "API returned no candidates"
                              )

                          content = candidates[0].get(
                              "content",
                              {}
                          )

                          parts = content.get(
                              "parts",
                              []
                          )

                          text_parts = []

                          for part in parts:
                              if isinstance(part, dict):
                                  text = part.get("text")

                                  if text:
                                      text_parts.append(text)

                          result = "\n".join(
                              text_parts
                          ).strip()

                          if result:
                              print(
                                  f"MODEL SUCCESS: {model}"
                              )

                              # Successful model remains available.
                              model_failures[model] = 0

                              return result

                          raise RuntimeError(
                              "API returned empty text"
                          )

                      # ------------------------------------------------
                      # RATE LIMIT / TEMPORARY FAILURE
                      # ------------------------------------------------

                      if response.status_code in (
                          429,
                          500,
                          502,
                          503,
                          504
                      ):

                          last_error = (
                              f"HTTP {response.status_code}: "
                              f"{response.text[:1000]}"
                          )

                          print(
                              f"MODEL FAILED: {model} "
                              f"HTTP {response.status_code}"
                          )

                          mark_rate_limited(model)

                          # Move immediately to next model.
                          rotate_model()

                          continue

                      # ------------------------------------------------
                      # PERMANENT MODEL/API ERROR
                      # ------------------------------------------------

                      if response.status_code in (
                          400,
                          401,
                          403,
                          404
                      ):

                          last_error = (
                              f"HTTP {response.status_code}: "
                              f"{response.text[:1000]}"
                          )

                          print(
                              f"MODEL DISABLED: {model} "
                              f"HTTP {response.status_code}"
                          )

                          disabled_until[model] = (
                              time.time() + 3600
                          )

                          rotate_model()

                          continue

                      raise RuntimeError(
                          f"Gemini API HTTP "
                          f"{response.status_code}: "
                          f"{response.text[:2000]}"
                      )

                  except requests.RequestException as exc:

                      last_error = str(exc)

                      print(
                          f"NETWORK ERROR on {model}: {exc}"
                      )

                      mark_failed(model)

                      rotate_model()

                      continue

                  except RuntimeError as exc:

                      last_error = str(exc)

                      print(
                          f"MODEL ERROR on {model}: {exc}"
                      )

                      mark_failed(model)

                      rotate_model()

                      continue

              raise RuntimeError(
                  "All model attempts failed. "
                  f"Last error: {last_error}"
              )

          # ============================================================
          # STATUS / IDENTITY CHECKS
          # ============================================================

          def extract_status(text):

              matches = re.findall(
                  r"^\s*FINAL STATUS:\s*"
                  r"(PROVEN|DERIVED-BUT-UNVERIFIED|"
                  r"VIABLE-CANDIDATE|FAILED|OPEN)\s*$",
                  text,
                  flags=re.MULTILINE
              )

              if not matches:
                  return "OPEN"

              return matches[-1]

          def detect_drift(text):

              lowered = text.lower()

              for forbidden in FORBIDDEN_REDEFINITIONS:

                  if forbidden in lowered:
                      return True

              required_identity = (
                  "MODEL IDENTITY: GSMH-HEREDITARY-GRAVITY"
              )

              if required_identity not in text:
                  return True

              return False

          # ============================================================
          # LOAD PREVIOUS STATE
          # ============================================================

          previous_synthesis = ""
          previous_audit = ""
          previous_repair = ""

          if STATE_FILE.exists():

              try:

                  previous_state = json.loads(
                      STATE_FILE.read_text(
                          encoding="utf-8"
                      )
                  )

                  previous_synthesis = (
                      previous_state.get(
                          "previous_synthesis",
                          ""
                      )
                  )

                  previous_audit = (
                      previous_state.get(
                          "previous_audit",
                          ""
                      )
                  )

                  previous_repair = (
                      previous_state.get(
                          "previous_repair",
                          ""
                      )
                  )

              except Exception:
                  pass

          # ============================================================
          # RESEARCH LOOP
          # ============================================================

          for cycle in range(
              1,
              MAX_CYCLES + 1
          ):

              print("")
              print("=" * 70)
              print(
                  f"GSMH RESEARCH CYCLE {cycle}"
              )
              print("=" * 70)
              print("")

              # ========================================================
              # FOUNDATION
              # ========================================================

              foundation_prompt = f"""
              You are the FOUNDATION agent.

              {GSMH_IDENTITY}

              Existing canonical model:
              {canonical_model[-12000:]}

              Existing open problems:
              {open_problems[-12000:]}

              Previous synthesis:
              {previous_synthesis[-16000:]}

              Previous audit:
              {previous_audit[-12000:]}

              Previous repair:
              {previous_repair[-12000:]}

              Determine ONE precise mathematical problem that this
              cycle must solve.

              Do not invent a new theory.
              Do not redefine GSMH.

              Explicitly distinguish:

              A. genuine hereditary memory
              B. ordinary retarded response
              C. curved-spacetime tail effects
              D. gravitational-wave memory
              E. unrelated modified gravity

              Output:

              IDENTITY CHECK

              CURRENT GAP

              SINGLE MATHEMATICAL TARGET

              REQUIRED DERIVATION

              REQUIRED FALSIFICATION TEST

              ACCEPTANCE CRITERIA
              """

              foundation = call_model(
                  foundation_prompt
              )

              # ========================================================
              # DERIVATION
              # ========================================================

              derivation_prompt = f"""
              You are the DERIVATION agent.

              {GSMH_IDENTITY}

              FOUNDATION REPORT:
              {foundation[-18000:]}

              PREVIOUS SYNTHESIS:
              {previous_synthesis[-18000:]}

              Perform ACTUAL mathematics.

              Priority:

              1. Derive the origin of the memory response.
              2. Investigate the microscopic CTP/2PI route if relevant.
              3. Investigate a microscopic field q with O=q^2.
              4. Analyze:

                 Pi(k) =
                 integral d^3q/(2*pi)^3
                 [
                   1 /
                   ((q^2+m^2)((q+k)^2+m^2))
                 ]

              5. Determine whether such a response can generate a
                 genuine hereditary gravitational kernel.
              6. Derive a covariant effective equation if justified.
              7. Vary any proposed action explicitly.
              8. Check conservation.
              9. Check diffeomorphism covariance.
              10. Derive the weak-field/Newtonian limit.
              11. Linearize the theory.
              12. Determine propagating degrees of freedom.
              13. Compute kinetic and gradient stability conditions.
              14. Determine causality/hyperbolicity.
              15. Derive the memory timescale if possible.
              16. Determine whether the effect can survive local tests.

              Never introduce an arbitrary scalar and call it memory.

              If an auxiliary field is introduced, prove why its
              dynamics represent genuine history dependence.

              Separate:

              EXACT RESULT
              DERIVED RESULT
              APPROXIMATION
              NUMERICAL RESULT
              CONJECTURE
              OPEN PROBLEM

              Show equations and
